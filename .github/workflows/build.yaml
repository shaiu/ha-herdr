name: Build

# Pull requests: lint and build both architectures without pushing.
# main: also push ghcr.io/<owner>/<arch>-addon-herdr:<version>, where the
# version is the one in herdr/config.yaml. Bumping it publishes a release;
# a version that already exists is never overwritten.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ADDON: herdr
  BUILDER_VERSION: 2026.09.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint add-on config
        uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ env.ADDON }}
      - name: Shellcheck
        run: |
          find "${ADDON}/rootfs" -type f \( -name run -o -name '*.sh' \) -print0 \
            | xargs -0 shellcheck --external-sources --shell=bash

  init:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Read add-on version
        id: version
        run: echo "version=$(yq -r .version "${ADDON}/config.yaml")" >> "$GITHUB_OUTPUT"
      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: '["aarch64", "amd64"]'
          image-name: addon-${{ env.ADDON }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [lint, init]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ./${{ env.ADDON }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          version: ${{ needs.init.outputs.version }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.21
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          skip-existing: ${{ needs.init.outputs.version }}
          cosign: "false"
